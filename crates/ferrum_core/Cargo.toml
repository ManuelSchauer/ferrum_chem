[package]
name = "ferrum_core"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
smallvec = { version = "1.11", features = ["const_generics"] }
rayon = "1.11.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
bitvec = "1.0"
ndarray = { version = "0.16", features = ["serde"] }
bincode = "1.3"
rustc-hash = "2.0"
ryu = "1.0"
itoa = "1.0"

[dev-dependencies]
tempfile = "3.10"
