[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ferrum_py"
version = "0.1.0"
description = "Ultra-fast molecular descriptor calculation for Python pipelines"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
]

[tool.maturin]
module-name = "ferrum_py"
