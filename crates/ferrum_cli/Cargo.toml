[package]
name = "ferrum_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ferrum_core = { path = "../ferrum_core" }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.11.0"
csv = "1.3"
mimalloc = "0.1"
crossterm = "0.28"
ratatui = "0.29"
tui-input = { version = "0.11", features = ["crossterm"] }
ndarray = "0.16"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
