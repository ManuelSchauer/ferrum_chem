name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Unit + integration tests (regressions, SMARTS edge cases, SDF, ...).
      - name: Run ferrum_core release tests
        run: cargo test -p ferrum_core --release --quiet -- --skip rdkit_parity

      # Column-by-column comparison against the committed RDKit reference.
      # Fails when any column gets worse than tests/data/rdkit_parity_baseline.tsv.
      - name: RDKit parity
        run: cargo test -p ferrum_core --release --test rdkit_parity -- --nocapture

      - name: Run ferrum_cli release tests
        run: cargo test -p ferrum_cli --release --quiet

  parity-reference:
    # The committed RDKit reference must be reproducible with the pinned RDKit version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned RDKit
        run: python -m pip install rdkit==2026.3.2

      - name: Check reference against RDKit
        run: python scripts/generate_parity_reference.py --check

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install ferrum_py
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin numpy
          cd crates/ferrum_py
          VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv PATH=$GITHUB_WORKSPACE/.venv/bin:$PATH maturin develop --release

      - name: Smoke test
        run: |
          .venv/bin/python - <<'EOF'
          import numpy as np, ferrum_py
          smiles = ["CCO", "not_a_smiles", "c1ccccc1"]
          names, X, fps, valid = ferrum_py.compute_descriptors(smiles)
          assert X.shape == (3, len(names)) and X.dtype == np.float64, X.shape
          assert np.isnan(X[1]).all() and not np.isnan(X[0]).all()
          assert valid.tolist() == [True, False, True], valid
          bits = ferrum_py.fingerprint_bits()
          ecfp = np.unpackbits(fps["ECFP4"], axis=1, bitorder="little", count=bits["ECFP4"])
          assert ecfp.shape == (3, 2048) and ecfp[0].any() and not ecfp[1].any()
          calc = ferrum_py.Calculator()
          n2, X2, f2, v2 = calc.compute(smiles)
          assert n2 == names and np.array_equal(X, X2, equal_nan=True) and np.array_equal(f2["ECFP4"], fps["ECFP4"])
          names, B = ferrum_py.compute_biosynfoni(smiles)
          assert B.shape == (3, len(names)), B.shape
          print("ok", X.shape, B.shape)
          EOF
